<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PDF Link Fetcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div style="margin-bottom: 25px;">
    <a href="https://partei-des-fortschritts.de/" target="_blank" rel="noopener noreferrer" style="display: flex; align-items: center;">
      <img src="logo.png" alt="Partei des Fortschritts" width="90" height="50" style="width: 90px; height: 50px;">
      
    </a>
    <div>
    </div>
  </div>
  <input type="text" id="urlInput" placeholder="Enter URL here..." class="url-input">
  <div class="controls-container">
    <div class="checkbox-group">
      <input type="checkbox" id="filterCheckbox" class="filter-checkbox">
      <label for="filterCheckbox" class="filter-label">Download Reports</label>
    </div>
    <div class="language-group">
      <label for="languageSelect" class="language-label">Output language:</label>
      <select id="languageSelect" class="language-select">
        <option value="BG">🇧🇬 Bulgarian</option>
        <option value="CS">🇨🇿 Czech</option>
        <option value="DA">🇩🇰 Danish</option>
        <option value="DE" selected>🇩🇪 German</option>
        <option value="EL">🇬🇷 Greek</option>
        <option value="EN">🇬🇧 English</option>
        <option value="ES">🇪🇸 Spanish</option>
        <option value="ET">🇪🇪 Estonian</option>
        <option value="FI">🇫🇮 Finnish</option>
        <option value="FR">🇫🇷 French</option>
        <option value="GA">🇮🇪 Irish</option>
        <option value="HR">🇭🇷 Croatian</option>
        <option value="HU">🇭🇺 Hungarian</option>
        <option value="IT">🇮🇹 Italian</option>
        <option value="LT">🇱🇹 Lithuanian</option>
        <option value="LV">🇱🇻 Latvian</option>
        <option value="MT">🇲🇹 Maltese</option>
        <option value="NL">🇳🇱 Dutch</option>
        <option value="PL">🇵🇱 Polish</option>
        <option value="PT">🇵🇹 Portuguese</option>
        <option value="RO">🇷🇴 Romanian</option>
        <option value="SK">🇸🇰 Slovak</option>
        <option value="SL">🇸🇮 Slovenian</option>
        <option value="SV">🇸🇪 Swedish</option>
      </select>
    </div>
  </div>
  <div class="buttons-container">
    <button id="fetchButton" class="button-half">Open all PDFs</button>
    <button id="downloadAllButton" class="button-half">Download all PDFs</button>
  </div>
  <input type="text" id="docNumberInput" placeholder="Enter Document IDs (e.g., A10-0049/2025, A10-0050/2025)">
  <div>
    <div id="result">Results will appear here...</div>
  </div>
  <div id="animatedConfirmation" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: white; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); padding: 20px; z-index: 1000; text-align: center;">
    <p id="confirmationMessage" style="margin-bottom: 20px; font-size: 16px; color: #333;"></p>
    <div style="display: flex; justify-content: space-between; gap: 10px;">
        <button id="cancelButton" style="background-color: #dc3545; color: white; border: none; border-radius: 5px; padding: 10px 20px; font-size: 14px; cursor: pointer;">Cancel</button>
        <button id="proceedButton" style="background-color: #28a745; color: white; border: none; border-radius: 5px; padding: 10px 20px; font-size: 14px; cursor: pointer;">Proceed</button>
    </div>
  </div>
  <footer style="margin-top: 20px; font-size: 12px; color: rgba(255, 255, 255, 0.9); text-align: center; background: rgba(0, 0, 0, 0.3); padding: 8px 15px; border-radius: 20px; backdrop-filter: blur(10px); position: relative; z-index: 1;">
    Made with 🧡 in the EU 🇪🇺 &middot;
    <a href="https://check-some-votes.eu" target="_blank" rel="noopener noreferrer" class="footer-link">check-some-votes.eu</a>
  </footer>
  <div class="info-container">
    <a href="https://github.com/OCISLY-ds/pdf-EP-view" target="_blank" rel="noopener noreferrer" class="info-box">
      <img src="github-mark.png" alt="GitHub" class="github-icon"> GitHub
    </a>
    <span id="extensionVersion" class="info-box">Version: Loading...</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
